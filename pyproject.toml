[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cvequality"
version = "0.1.0"
description = "GPU-accelerated Python port of R's cvequality: tests for equality of coefficients of variation across k groups, batched to tens of millions of tests, plus an SD-ratio test for differential variability."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["statistics", "coefficient-of-variation", "single-cell", "perturb-seq", "gpu", "pytorch"]
authors = [{ name = "Hani Goodarzi" }]
dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/hanig/cvequality"
Issues = "https://github.com/hanig/cvequality/issues"

[project.optional-dependencies]
# Extras for the single-cell adapter and the test suite; the core statistics need
# only numpy and torch.
adapter = ["pandas>=1.5", "pyarrow>=10", "h5py>=3.0", "anndata>=0.13.0", "scipy>=1.9"]
test = ["pytest>=7", "pandas>=1.5", "pyarrow>=10", "scipy>=1.9", "h5py>=3.0", "anndata>=0.13.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device",
    "slow: long-running (large nr, many seeds)",
    "rfixtures: requires tests/r/fixtures.json (generate with tests/r/generate_fixtures.R)",
]
